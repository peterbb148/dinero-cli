[project]
name = "dinero-cli"
version = "0.0.0"
description = "Dinero command-line interface (binary distribution)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.16,<1",
]

[project.scripts]
dinero = "dinero_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinero_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dinero_cli", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 81
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
files = ["src", "scripts"]
check_untyped_defs = true

[dependency-groups]
build = [
    "pyinstaller>=6.22,<7",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
]
