name: Native binaries
on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      version:
        required: true
        type: string
      upload:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2022
            target: windows-x86_64
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev --group build
      - name: Build and test standalone executable
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: uv run --no-sync python -m scripts.build build --version "$BUILD_VERSION" --target "$BUILD_TARGET"
      - name: Transfer release binary
        if: inputs.upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dinero-binary-${{ matrix.target }}
          path: dist/archives/*.zip
          if-no-files-found: error
          retention-days: 1
